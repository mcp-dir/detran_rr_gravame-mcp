# Smithery configuration for DETRAN RR: Gravame
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_detran_rr_gravame

name: detran_rr_gravame-mcp
displayName: "DETRAN RR: Gravame"
description: >
  DETRAN RR: Gravame, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_rr_gravame-mcp
repository: https://github.com/mcp-dir/detran_rr_gravame-mcp

tags:
  - detran_rr_gravame
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_detran_rr_gravame

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_detran_rr_gravame/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
